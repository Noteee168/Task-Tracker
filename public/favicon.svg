        <rect x="0" y="0" width="14" height="19" rx="3" fill="#38BDF8" fill-opacity="0.3" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.7"/>
    </g>

    <!-- Velocity Checkmark -->
    <path d="M19 22.5L24.5 33.5L24.5 25.5L20 21.5Z" fill="url(#tt-fav-facet-left)"/>
    <path d="M24.5 33.5L37.5 12.5L27 22L24.5 25.5Z" fill="url(#tt-fav-facet-right)"/>
    <path d="M18.5 22.5L24.5 34L37.5 12" stroke="url(#tt-fav-stroke)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="39.5" cy="10" r="1.5" fill="#38BDF8"/>
