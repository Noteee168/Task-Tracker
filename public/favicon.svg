<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="tt-fav-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#0F172A"/>
            <stop offset="55%" stop-color="#1E1B4B"/>
            <stop offset="100%" stop-color="#0284C7"/>
        </linearGradient>
        <linearGradient id="tt-fav-border" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.8"/>
            <stop offset="40%" stop-color="#6366F1" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.8"/>
        </linearGradient>
        <linearGradient id="tt-fav-stroke" x1="18" y1="22" x2="38" y2="12" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#E0E7FF"/>
            <stop offset="50%" stop-color="#BAE6FD"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
        <linearGradient id="tt-fav-facet-right" x1="24" y1="34" x2="38" y2="12" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38BDF8"/>
            <stop offset="50%" stop-color="#00F2FE"/>
            <stop offset="100%" stop-color="#FFFFFF"/>
        </linearGradient>
        <linearGradient id="tt-fav-facet-left" x1="19" y1="21" x2="25" y2="34" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#C084FC"/>
            <stop offset="100%" stop-color="#6366F1"/>
        </linearGradient>
    </defs>

    <rect width="48" height="48" rx="12" fill="url(#tt-fav-bg)"/>
    <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="11.25" fill="none" stroke="url(#tt-fav-border)" stroke-width="1.5"/>

